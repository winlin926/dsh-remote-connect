# Self-hostable public relay: server + Caddy (automatic HTTPS).
#
#   cp .env.example .env        # then edit SITE_ADDRESS / PUBLIC_ORIGIN etc.
#   docker compose up -d --build
#
# The build context is the repository root so the image can compile the shared
# tunnel protocol from src/remote.
name: dsh-remote-server

services:
  remote-server:
    build:
      context: ..
      dockerfile: remote-server/Dockerfile
    image: dsh-remote-server:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8787"
      BIND_HOST: 0.0.0.0
      DATA_DIR: /data
      # Caddy terminates TLS and forwards the original origin/host.
      TRUST_PROXY: "1"
    volumes:
      # /data holds remote-server.sqlite AND node-identity.json (mode 0600).
      # Keep the whole volume together: losing the identity changes the node
      # fingerprint and forces every paired client to confirm the node again.
      - data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - remote-server
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. relay.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
