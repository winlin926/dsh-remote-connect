# Self-hostable public relay: server + Caddy (automatic HTTPS) + optional coturn.
#
#   cp .env.example .env        # then edit SITE_ADDRESS / PUBLIC_ORIGIN etc.
#   docker compose up -d --build
#   docker compose --profile turn up -d   # optional TURN relay
#
# The build context is the repository root so the image can compile the shared
# protocol from src/remote/vendor.
name: dsh-remote-server

services:
  remote-server:
    build:
      context: ..
      dockerfile: remote-server/Dockerfile
    image: dsh-remote-server:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8787"
      BIND_HOST: 0.0.0.0
      DATA_DIR: /data
      # Caddy terminates TLS and forwards the original origin/host.
      TRUST_PROXY: "1"
    volumes:
      - data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - remote-server
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. relay.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional TURN relay. Requires PUBLIC_IP and TURN_SECRET in .env; the server
  # issues matching coturn REST credentials from /v1/turn-credentials.
  coturn:
    image: coturn/coturn:4.6.3
    profiles:
      - turn
    restart: unless-stopped
    network_mode: host
    command:
      - --no-cli
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET in .env}
      - --realm=${TURN_REALM:-dsh-remote}
      - --external-ip=${PUBLIC_IP:?set PUBLIC_IP in .env}
      - --min-port=49160
      - --max-port=49200

volumes:
  data:
  caddy_data:
  caddy_config:
